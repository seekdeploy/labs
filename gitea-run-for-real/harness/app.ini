APP_NAME = Gitea run for real
RUN_MODE = prod
WORK_PATH = /srv/gitea-run

[database]
DB_TYPE = sqlite3
PATH = /srv/gitea-run/data/gitea.db

[server]
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3000
ROOT_URL = http://127.0.0.1:3000/
DISABLE_SSH = true
OFFLINE_MODE = true

[security]
INSTALL_LOCK = true

[service]
DISABLE_REGISTRATION = true

[log]
MODE = file
LEVEL = Info
ROOT_PATH = /srv/gitea-run/log

[migrations]
ALLOW_LOCALNETWORKS = false

[oauth2]

[actions]
ENABLED = true
DEFAULT_ACTIONS_URL = self
