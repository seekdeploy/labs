APP_NAME = CI guardrail lab
RUN_MODE = prod
WORK_PATH = /srv/ci-lab
[database]
DB_TYPE = sqlite3
PATH = /srv/ci-lab/data/gitea.db
[server]
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3002
ROOT_URL = http://127.0.0.1:3002/
DISABLE_SSH = true
OFFLINE_MODE = true
[security]
INSTALL_LOCK = true
[service]
DISABLE_REGISTRATION = true
[log]
MODE = file
LEVEL = Info
ROOT_PATH = /srv/ci-lab/log
[actions]
ENABLED = true
DEFAULT_ACTIONS_URL = self
